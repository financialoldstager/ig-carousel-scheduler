name: Publish IG + Threads at 8:30PM MYT

# 目標發佈時刻：20:30 MYT = 12:30 UTC（馬來西亞無夏令時間，固定 UTC+8）
#
# ⚠️ 為什麼不直接把 cron 設在 12:30：GitHub Actions 的 schedule 只保證「不早於」，
#    實測漂移是「兩到三小時」等級（2026-07-02 晚 2h50m、2026-07-30 晚 2h12m），
#    等於每次都錯過 19:30–20:30 的黃金時段、發在快 11 點。
#
# 解法（2026-07-31 改）：cron 提早到 08:00 UTC 觸發，job 先睡到 12:30 UTC 整點才發。
#    漂移緩衝 4.5 小時，遠大於實測值。repo 是 public → Actions 分鐘數免費無上限，
#    睡覺不花錢。11:00 UTC 那條是備援，防「GitHub 整個把 run 丟掉」。
#    兩條 cron 同時存在不會雙發：concurrency 讓備援排隊等主引信跑完，
#    輪到它時 checkout 拿到的 manifest 已是 published，run_publish.py 自己會跳過。
on:
  schedule:
    - cron: "0 8 * * *"    # 主引信：16:00 MYT 觸發，睡到 20:30 MYT 才發
    - cron: "0 11 * * *"   # 備援：19:00 MYT 觸發，主引信被丟掉時補位
  workflow_dispatch:
    inputs:
      dry:
        description: "乾跑（只建容器不發佈）"
        type: boolean
        default: false
      date:
        description: "指定日期 YYYY-MM-DD（留空＝今天 MYT）"
        type: string
        default: ""
      wait:
        description: "等到 20:30 MYT 才發（手動觸發預設不等，立刻發）"
        type: boolean
        default: false

permissions:
  contents: write   # 讓 workflow 把更新後的 manifest 狀態 commit 回來

concurrency:
  group: publish-daily
  cancel-in-progress: false   # 備援排隊等主引信跑完，不要互相取消

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 4.5h 等待 + 餘裕；上限 6h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install certifi

      # 睡之前先看今天的 manifest 還需不需要發。備援排隊輪到時多半已是 published，
      # 這一步讓它直接結束，不要白佔 runner 幾個小時。
      - name: Check if already published
        id: check
        run: |
          DATE_ARG="${{ inputs.date }}"
          if [ -z "$DATE_ARG" ]; then DATE_ARG=$(TZ=Asia/Kuala_Lumpur date +%Y-%m-%d); fi
          echo "date=$DATE_ARG" >> "$GITHUB_OUTPUT"
          python3 - "$DATE_ARG" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          d = sys.argv[1]
          p = f"queue/{d}.json"
          if not os.path.exists(p):
              print("todo=none")          # 今天沒排東西
              raise SystemExit(0)
          m = json.load(open(p))
          pending = [k for k in ("ig", "threads")
                     if (m.get(k) or {}).get("status") != "published"]
          print("todo=" + (",".join(pending) if pending else "none"))
          PY
          cat "$GITHUB_OUTPUT"

      # 精準引信：睡到 12:30 UTC 整點。已經過了就立刻發（遲到總比不發好）。
      - name: Wait until 20:30 MYT
        if: ${{ steps.check.outputs.todo != 'none' && (github.event_name == 'schedule' || inputs.wait) }}
        run: |
          TARGET=$(date -u -d "$(date -u +%Y-%m-%d)T12:30:00Z" +%s)
          NOW=$(date -u +%s)
          DELTA=$(( TARGET - NOW ))
          if [ "$DELTA" -le 0 ]; then
            echo "⚠️ 已過 12:30 UTC（遲 $(( -DELTA / 60 )) 分鐘），不等待、立刻發佈"
            exit 0
          fi
          if [ "$DELTA" -gt 18000 ]; then
            echo "⚠️ 距目標 $(( DELTA / 60 )) 分鐘，超過 5 小時上限，不等待、立刻發佈"
            exit 0
          fi
          echo "距 20:30 MYT 還有 $(( DELTA / 60 )) 分 $(( DELTA % 60 )) 秒，睡到整點再發"
          sleep "$DELTA"
          echo "到點，開始發佈：$(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M:%S %Z')"

      # ⚠️ 真正的防重複關卡在這裡，不在睡前那步（2026-08-01 重複發文事故）。
      # 睡前的判斷用的是各自開跑那一刻的 manifest，兩條 cron 都會看到「還沒發」。
      # 睡醒後重抓遠端 manifest 重算，並用 git push 當 compare-and-swap 搶鎖：
      # 因為推之前已 reset --hard origin/main，push 成功＝期間沒人搶先，
      # push 被拒＝別人先發了，本 run 直接放棄，絕不重複貼文。
      - name: Re-check and claim lock (after wait)
        id: claim
        if: ${{ steps.check.outputs.todo != 'none' }}
        run: |
          set -euo pipefail
          git config user.name "ig-carousel-bot"
          git config user.email "bot@financialoldstager.com"
          git fetch origin main
          git reset --hard origin/main

          if [ "${{ inputs.dry }}" = "true" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "dry run：不佔鎖、不推 commit。"
            exit 0
          fi

          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          TODO=$(python3 scripts/claim.py --date "${{ steps.check.outputs.date }}" \
                   --run-id "${{ github.run_id }}" $FORCE)
          echo "睡醒後重讀 manifest：todo=$TODO"

          if [ "$TODO" = "none" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "已發過或鎖在別的 run 手上，本 run 結束。"
            exit 0
          fi

          git add queue/*.json
          git commit -q -m "chore: 佔用發佈鎖 run ${{ github.run_id }}（$TODO）"
          if git push -q origin HEAD:main; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "✅ 搶到鎖，開始發佈。"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "⚠️ 另一個 run 先搶到鎖（push 被拒），本 run 不發佈。"
          fi

      - name: Run publisher
        if: ${{ steps.claim.outputs.go == 'yes' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python3 scripts/run_publish.py $ARGS

      - name: Skip notice
        if: ${{ steps.check.outputs.todo == 'none' || steps.claim.outputs.go == 'no' }}
        run: echo "今天沒有待發項目（無 manifest／已 published／鎖被別的 run 拿走），結束。"

      # 收尾記帳。貼文這時已經發出去了，所以這步失敗不該讓整個 workflow 紅掉、
      # 也不該寄失敗信給老蕭——重試三次，真的推不上去就留警告，狀態下次會補正。
      - name: Commit manifest status (if changed)
        if: ${{ inputs.dry != true && steps.claim.outputs.go == 'yes' }}
        run: |
          git config user.name "ig-carousel-bot"
          git config user.email "bot@financialoldstager.com"
          if git diff --quiet -- queue/; then
            echo "manifest 無變動，不 commit"
            exit 0
          fi
          for i in 1 2 3; do
            git add queue/*.json
            git diff --cached --quiet && break
            git commit -q -m "chore: 更新 manifest 發佈狀態"
            if git push -q origin HEAD:main; then
              echo "✅ manifest 狀態已回寫（第 $i 次嘗試）"
              exit 0
            fi
            echo "第 $i 次 push 失敗，重抓遠端後再試"
            git fetch origin main
            # 本 run 是唯一持鎖者，遠端不會有人動同一份 manifest；
            # 萬一撞上（例如老蕭手動改），以本 run 的發佈結果為準。
            git rebase --strategy-option=theirs origin/main || git rebase --abort
          done
          echo "::warning::manifest 狀態回寫失敗，但貼文已發出，不視為失敗"
